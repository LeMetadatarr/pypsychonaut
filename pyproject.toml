[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pypsychonaut"
dynamic = ["version"]
description = "Typed Python client for PsychonautWiki (psychonautwiki.org)"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "JarbasAi", email = "jarbasai@mailfence.com" }]
requires-python = ">=3.9"
dependencies = ["requests>=2.28", "beautifulsoup4>=4.11", "unblock_requests"]
keywords = ["psychonautwiki", "harm-reduction", "drugs", "scraper", "graphql", "metadata"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP",
]

[project.optional-dependencies]
anon = ["anon_requests"]
stealth = ["curl-cffi"]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/TigreGotico/pypsychonaut"
Repository = "https://github.com/TigreGotico/pypsychonaut"

[tool.setuptools.packages.find]
where = ["."]
include = ["pypsychonaut*"]

[tool.setuptools.dynamic]
version = {attr = "pypsychonaut.version.__version__"}

[tool.pytest.ini_options]
markers = [
    "live: tests that hit the live PsychonautWiki API (deselected by default with -m 'not live')",
]
